<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NanoByte - Detalles del producto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .info-card {
      position: relative;
      background-size: cover;
      background-position: center;
      border-radius: 20px;
      overflow: hidden;
      height: 350px;
      display: flex;
      align-items: end;
      transition: transform 0.3s ease;
    }

    .info-card:hover {
      transform: scale(1.02);
    }

    .info-card .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
    }

    .info-card .card-content {
      position: relative;
      z-index: 2;
      padding: 1.5rem;
    }

    .btn-modal {
      margin-top: 10px;
      background-color: #0d6efd;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      transition: background-color 0.3s ease;
    }

    .btn-modal:hover {
      background-color: #084298;
    }

    .modal-content {
      background-color: #222;
      color: #fff;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<header class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">NanoByte</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="nanobyte.html">Inicio</a></li>
      </ul>
    </div>
  </div>
</header>

<!-- Hero Section -->
<section class="text-white text-center d-flex align-items-center justify-content-center" style="background-image: url('imagenes/lienas color.avif'); height: 60vh; background-size: cover; position: relative;">
  <div class="overlay" style="background-color: rgba(0,0,0,0.5); width: 100%; height: 100%; position: absolute;"></div>
  <div class="container position-relative">
    <h1 id="heroTitle" class="display-4">Detalles del producto</h1>
    <p class="lead">Explora nuestras soluciones adaptadas a tus necesidades</p>
  </div>
</section>

<!-- Cards Container -->
<main class="container my-5">
  <div class="row g-4" id="cards-container">
    <!-- Las tarjetas se insertan aquí dinámicamente -->
  </div>
</main>

<!-- Modal -->
<div class="modal fade" id="infoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-4">
      <div class="modal-header border-0">
        <h5 class="modal-title" id="modalTitle">Título</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalBody">Contenido detallado aquí.</div>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-4">
  <p>&copy; 2025 NanoByte. Todos los derechos reservados.</p>
</footer>

<!-- JavaScript -->
<script>
const data = {
  home: [
    { title: "Mayor eficiencia y productividad", text: "", img: "imagenes/estacion1.jpg", detail: "Un procesador rápido te permite ejecutar múltiples aplicaciones sin retrasos, optimizando tu tiempo y evitando interrupciones innecesarias." },
    { title: "Capacidad para manejar cargas intensivas", text: "", img: "imagenes/estacion2.jpg", detail: "Si trabajas con software de edición, modelado 3D, análisis de datos o simulaciones, un procesador de alto rendimiento te ayudará a procesar información de manera más fluida y sin bloqueos." },
    { title: "Mejor experiencia en multitarea", text: "", img: "imagenes/estacion3.jpg", detail: "Abrir varias pestañas en el navegador, ejecutar programas de oficina y trabajar con archivos pesados al mismo tiempo será mucho más ágil con un procesador potente." },
    { title: "Durabilidad y compatibilidad con futuras actualizaciones", text: "", img: "imagenes/estacion4.jpg", detail: "Elegir un buen procesador garantiza que tu equipo se mantenga relevante por más tiempo, sin necesidad de cambiar componentes constantemente." }, 
  ],
  gaming: [
    { title: "Mayor rendimiento y velocidad", text: "", img: "imagenes/estacion1.jpg", detail: "Los procesadores de gaming están diseñados para manejar cargas de trabajo intensivas, ofreciendo velocidades de reloj más altas y múltiples núcleos para mejorar el rendimiento en juegos exigentes." },
    { title: "Menos latencia y mejor respuesta", text: "", img: "imagenes/estacion2.jpg", detail: "Un buen procesador reduce los tiempos de carga, optimiza la comunicación entre los componentes y mejora la respuesta en juegos competitivos, donde cada milisegundo cuenta." },
    { title: "Capacidad para multitarea", text: "", img: "imagenes/estacion3.jpg", detail: "Si te gusta hacer streaming, grabar partidas o usar software de edición mientras juegas, un procesador potente permitirá que todo funcione sin interrupciones ni pérdida de rendimiento." },
    { title: "Mayor longevidad y compatibilidad con futuras tecnologías", text: "", img: "imagenes/estacion4.jpg", detail: "Un procesador de gaming de última generación te permitirá disfrutar de los próximos títulos sin preocuparte por actualizaciones constantes." }
  ],
  business: [
    { title: "disponibilidad y tiempos de entrega optimizados", text: "", img: "imagenes/estacion1.jpg", detail: "Mantenemos un suministro constante de microprocesadores y tiempos de entrega rápidos para que las empresas no tengan interrupciones en su producción." },
    { title: "precios competitivos y acuerdos personalizados", text: "", img: "imagenes/estacion2.jpg", detail: "Ajustamos nuestras tarifas a las necesidades de cada cliente, con descuentos por volumen y acuerdos estratégicos que les permiten reducir costos." },
    { title: "asesoramiento técnico y soporte especializado", text: "", img: "imagenes/estacion3.jpg", detail: "No solo distribuimos productos, sino que ofrecemos orientación sobre compatibilidad, rendimiento y mejores prácticas para que nuestros clientes tomen decisiones informadas." },
    { title: "infraestructura logística eficiente", text: "", img: "imagenes/estacion4.jpg", detail: "Tenemos una red de distribución optimizada que minimiza riesgos y retrasos, asegurando que los productos lleguen en perfectas condiciones y dentro del plazo acordado." }
  ],
  ai: [
    { title: "Entrenamiento de modelos de aprendizaje profundo", text: "", img: "imagenes/estacion1.jpg", detail: "Los procesadores de alto rendimiento permiten entrenar redes neuronales con conjuntos de datos masivos, acelerando el tiempo necesario para que los modelos aprendan y mejoren su precisión." },
    { title: "Inferencia rápida en tiempo real", text: "", img: "imagenes/estacion2.jpg", detail: "Una vez entrenado el modelo, los procesadores optimizan la ejecución de inferencias, facilitando respuestas ágiles y eficientes en aplicaciones como asistentes virtuales, análisis de imágenes y procesamiento de lenguaje natural." },
    { title: "Optimización de algoritmos y paralelización de tareas", text: "", img: "imagenes/estacion3.jpg", detail: "Procesadores avanzados pueden distribuir cálculos entre múltiples núcleos, mejorando la velocidad y eficiencia de la IA en aplicaciones que requieren grandes cantidades de datos, como análisis predictivo y simulaciones." },
    { title: "Mejor gestión de recursos en la computación en la nube", text: "", img: "imagenes/estacion4.jpg", detail: "En entornos de nube, los procesadores permiten manejar múltiples instancias de IA de manera eficiente, garantizando un mejor rendimiento y escalabilidad para empresas y desarrolladores." }
  ],
};

const option = new URLSearchParams(window.location.search).get("option");
const cardsContainer = document.getElementById("cards-container");

// Títulos dinámicos para la sección hero
const heroTitles = {
  home: "Estaciones de Trabajo",
  gaming: "Gaming Extremo",
  business: "Soluciones Empresariales",
  ai: "Potencia para IA"
};

const heroTitleElement = document.getElementById("heroTitle");
if (heroTitles[option]) {
  heroTitleElement.textContent = heroTitles[option];
}

if (data[option]) {
  data[option].forEach((card, i) => {
    const col = document.createElement("div");
    col.className = "col-md-6 col-lg-3";
    col.innerHTML = ` 
      <div class="info-card" style="background-image: url('${card.img}')">
        <div class="overlay"></div>
        <div class="card-content">
          <h5 class="card-title">${card.title}</h5>
          <p class="card-text">${card.text}</p>
          <button class="btn-modal" data-bs-toggle="modal" data-bs-target="#infoModal" data-title="${card.title}" data-detail="${card.detail}">Ver más</button>
        </div>
      </div>`;
    cardsContainer.appendChild(col);
  });
} else {
  cardsContainer.innerHTML = `
    <div class="col-12 text-center">
      <h2>Contenido no disponible</h2>
      <p>Regresa a la página principal y selecciona una categoría válida.</p>
    </div>`;
}

// Modal handler
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('btn-modal')) {
    const title = e.target.getAttribute('data-title');
    const detail = e.target.getAttribute('data-detail');
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalBody').innerText = detail;
  }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
