  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #0a0a0a;
      color: #f0f0f0;
      overflow-x: hidden;
      letter-spacing: 0.03em;
      line-height: 1.4;
      transition: background-color 0.3s ease;
      width: 100%;
    }

    nav.navbar {
      background: #121212;
      padding: 1rem 2rem;
      border-bottom: 2px solid #e60012;
      text-align: center;
    }

    nav.navbar h1 {
      font-weight: 900;
      font-size: 1.6rem;
      color: #e60012;
      letter-spacing: 0.05em;
      margin: 0;
    }

    main.container {
      padding: 2rem;
    }

    .section-title {
      font-weight: 900;
      font-size: 1.5rem;
      margin-bottom: 1rem;
      border-left: 5px solid #e60012;
      padding-left: 0.75rem;
      color: #ff3b3b;
    }

    .table {
      background-color: #181818;
      color: #f0f0f0;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
    }

    .table th {
      background-color: #202020;
      color: #ff3b3b;
      font-weight: 700;
      border-bottom: 2px solid #e60012;
    }

    .table td {
      background-color: #1a1a1a;
      border-bottom: 1px solid #333;
    }

    .table tr:hover {
      background-color: #262626;
    }

    .disponible {
      color: #4caf50;
      font-weight: 600;
    }

    .no-disponible {
      color: #ccc;
      font-weight: 400;
    }
  </style>
</head>

        fila.innerHTML = `
          <td>${proc.nombre}</td>
